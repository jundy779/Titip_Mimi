<!doctype html>
<html lang="id"><meta charset="utf-8"><title>Uji agenda Mimi</title>
<h1>Uji agenda Mimi</h1>
<p>Jalankan pada origin pengujian kosong yang menyajikan build web di /. Hasil ditampilkan per ukuran layar.</p>
<button id="start">Mulai pengujian</button><pre id="report"></pre>
<iframe title="Planner dalam viewport uji" style="height:750px;border:0"></iframe>
<script type="module">
const frame = document.querySelector('iframe');
const report = document.querySelector('#report');
const start = document.querySelector('#start');
const itemsKey = 'ruang-iqlima-demo-v1';
const themeKey = 'titip-mimi-theme';
function assert(ok, message) {
  if (!ok) throw new Error(message);
}
function openPage(path = '/') {
  return new Promise(resolve => {
    frame.onload = resolve;
    frame.src = path;
  });
}
async function checkWidth(width) {
  frame.style.width = width + 'px';
  localStorage.setItem(itemsKey, '[]');
  await openPage();
  const doc = () => frame.contentDocument;
  const one = selector => doc().querySelector(selector);
  const click = selector => { assert(one(selector), 'Elemen hilang ' + selector); one(selector).click(); };
  const fits = () => assert(doc().documentElement.scrollWidth <= width, 'Halaman meluap: ' + doc().body.dataset.page);
  const stored = () => JSON.parse(localStorage.getItem(itemsKey));
  assert(doc().documentElement.dataset.theme === 'light', 'Tema awal');
  for (const theme of ['light', 'dark']) {
    if (theme === 'dark') {
      click('[data-section="Profil"]');
      click('[data-dark-switch]');
    }
    for (const section of ['Koleksi','Agenda','Profil','Hari Ini']) {
      click('[data-section="' + section + '"]');
      assert(doc().body.dataset.page === section, 'Navigasi ' + section);
      assert(doc().documentElement.dataset.theme === theme, 'Tema ' + section);
      fits();
    }
    if (width <= 600) {
      const journal = one('.journal').getBoundingClientRect();
      for (const selector of ['.agenda', '.mimi-list', '.shelf', '.mimi-play-link']) {
        assert(Math.abs(one(selector).getBoundingClientRect().width - journal.width) <= 1, 'Lebar kartu ' + selector);
      }
    }
    for (const kind of ['note','account','agenda']) {
      click('[data-capture-kind="' + kind + '"]');
      const modal = one('#box[open]');
      assert(modal && modal.scrollWidth <= modal.clientWidth + 1, 'Lebar formulir ' + kind);
      click('#cancel');
    }
    await openPage('/kamar-mimi.html');
    assert(doc().documentElement.dataset.theme === theme, 'Tema Kamar Mimi');
    for (const mode of ['feed','wash','chat','play']) {
      click('[data-mode="' + mode + '"]');
      assert(one('[aria-pressed="true"]').dataset.mode === mode, 'Kegiatan ' + mode);
      fits();
    }
    await openPage();
  }
  click('[data-section="Profil"]');
  click('[data-dark-switch]');
  click('[data-section="Hari Ini"]');
  const heading = frame.contentWindow.getComputedStyle(one('#page h1')).fontSize;
  click('[data-capture-kind="agenda"]');
  one('#judul').value = 'Uji ambil pesanan';
  one('#waktu').value = '2020-01-02T10:00';
  one('#form').requestSubmit();
  assert(!one('#reminder').hidden && one('#due-title').textContent === 'Uji ambil pesanan', 'Pengingat jatuh tempo');
  const before = Date.now();
  click('#due-snooze');
  assert(stored()[0].snoozeUntil >= before + 600000 && stored()[0].snoozeUntil <= Date.now() + 600000, 'Tunda sepuluh menit');
  await openPage();
  assert(one('#reminder').hidden && stored()[0].time === '2020-01-02T10:00', 'Tunda setelah muat ulang');
  click('[data-section="Koleksi"]');
  const search = one('#page input');
  search.value = 'ambil pesanan';
  search.dispatchEvent(new Event('input', {bubbles:true}));
  click('.collection-results .collection-item');
  assert(one('dialog[open] h2').textContent === 'Uji ambil pesanan', 'Buka hasil pencarian');
  Array.from(one('dialog[open]').querySelectorAll('button')).find(button => button.textContent === 'Tandai selesai').click();
  await openPage();
  click('[data-section="Agenda"]');
  assert(stored()[0].done && one('details.agenda-group summary').textContent === 'Selesai (1)' && one('#reminder').hidden, 'Status selesai setelah muat ulang');
  report.textContent += width + ' px lulus; ukuran judul beranda ' + heading + '\n';
}
start.onclick = async () => {
  if ([itemsKey,themeKey].some(key => localStorage.getItem(key) !== null)) {
    report.textContent = 'Gunakan origin pengujian kosong agar data yang ada tetap aman.';
    return;
  }
  start.disabled = true;
  report.textContent = '';
  try {
    for (const width of [320,360,390,768,1280]) await checkWidth(width);
    report.textContent += 'Semua pemeriksaan lulus.';
  } catch (error) {
    report.textContent += 'Gagal pada ' + frame.style.width + ': ' + error.message;
  } finally {
    frame.src = 'about:blank';
    localStorage.removeItem(itemsKey);
    localStorage.removeItem(themeKey);
    start.disabled = false;
  }
};
</script></html>
