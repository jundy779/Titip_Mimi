<!DOCTYPE html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f8eee5"><title>Kamar Mimi · Ruang Iqlima</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#452d38;background:#f7efe7;font:16px/1.45 system-ui,sans-serif}main{max-width:980px;margin:auto;padding:clamp(10px,3vw,32px)}header,.bar,nav,#choices{display:flex;align-items:center;gap:10px}header{justify-content:space-between;margin:0 0 12px}a,button{font:inherit;color:inherit;touch-action:manipulation}a{text-decoration:none}h1{font: bold clamp(22px,4vw,34px) Georgia,serif;margin:0}header a,.hearts{font-size:14px}.hearts{border-radius:30px;background:#ffe1e3;color:#893c55;padding:8px 13px;font-weight:bold}.room{position:relative;border-radius:26px 26px 0 0;overflow:hidden;background:#f8d7cb;isolation:isolate}canvas{display:block;width:100%;height:clamp(340px,57svh,540px);touch-action:none}.bubble{position:absolute;top:14px;left:50%;transform:translateX(-50%);padding:9px 16px;border-radius:18px;background:#fffcf5ed;color:#573848;text-align:center;width:max-content;max-width:85%;font:italic 16px/1.3 Georgia,serif;pointer-events:none;box-shadow:0 3px 14px #734c4820}.panel{border-radius:0 0 26px 26px;background:#fffaf4;padding:16px clamp(12px,3vw,28px);box-shadow:0 8px 28px #69414412}.bar{justify-content:space-between;flex-wrap:wrap}.bar p{margin:0;flex:1 1 205px}button{cursor:pointer;min-height:44px;border:1px solid #cfb4ac;background:#fff8f1;border-radius:14px;padding:8px 14px}button:focus-visible,a:focus-visible{outline:3px solid #933e65;outline-offset:2px}button:active{transform:translateY(1px)}nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;border-top:1px solid #eadbd3;margin-top:13px;padding-top:12px}nav button{display:flex;align-items:center;justify-content:center;gap:7px;background:transparent;border-color:transparent;font-weight:650}nav button[aria-pressed=true]{background:#f8dbe0;color:#793c55;border-color:#e3b7c3}nav span{font-size:22px}#choices{flex-wrap:wrap;margin-top:10px}#choices:empty{display:none}#fallback{position:absolute;inset:0;background:#fae1d5;text-align:center}#fallback img{height:83%;max-width:80%;object-fit:contain}#fallback p{margin:0;font-size:13px}@media(max-width:540px){main{padding:10px 8px}nav button{flex-direction:column;gap:1px;padding:5px 0;font-size:13px}header a{font-size:13px}.bar p{font-size:14px}.bar button{font-size:14px}.bubble{font-size:15px}}

body{background:#eee5d9;color:#44343c}
main{max-width:1160px}
.room{background:#e9cbb8 url("mimi-terrace.webp") center center/cover no-repeat;box-shadow:inset 0 0 0 1px #b99d71}
canvas{position:relative;height:clamp(390px,65svh,665px)}
.place{position:absolute;left:16px;top:16px;padding:5px 14px;background:#323c45db;color:#fff1cf;border:1px solid #e9d299;font:16px Georgia,serif;border-radius:2px;pointer-events:none}
.bubble{top:auto;bottom:10px;font-size:15px;background:#fffaf0ea;border:1px solid #dac09b}
.panel{background:#fff9f0;border:1px solid #d8c6ad;border-top:0}
.petals{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.petals i{position:absolute;top:-5%;left:calc(var(--n)*15%);width:9px;height:5px;background:#ffd1dd;border-radius:85% 12% 76% 23%;animation:petal calc(11s + var(--n)*.7s) linear infinite;animation-delay:calc(var(--n)*-2.8s)}
@keyframes petal{0%{transform:translate(0,-2vh) rotate(-40deg);opacity:0}12%{opacity:.86}80%{opacity:.72}100%{transform:translate(-65px,68vh) rotate(270deg);opacity:0}}
@media(prefers-reduced-motion:reduce){.petals{display:none}}
@media(max-width:540px){.place{left:10px;top:10px;font-size:14px}.room{background-position:49% center}}
.gestures{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.gestures button{font-size:14px;padding:6px 12px;background:#fff0ef}</style><main><header><a href="./">‹ Hari Ini</a><h1>Kamar Mimi</h1><span class="hearts" aria-label="Hati terkumpul">♡ <b id="score">0</b></span></header><section class="room" aria-label="Teras mawar"><div class="place">✧ Teras mawar</div><div aria-hidden="true" class="petals"><i style="--n:0"></i><i style="--n:1"></i><i style="--n:2"></i><i style="--n:3"></i><i style="--n:4"></i><i style="--n:5"></i><i style="--n:6"></i></div><canvas tabindex="0" aria-label="Kamar tiga dimensi Mimi. Gunakan panah kiri atau kanan untuk mengibaskan benang."></canvas><div id="fallback" hidden><img src="mimi.webp" alt="Mimi memeluk buku pink"><p>Mode ilustrasi · Gunakan tombol di bawah untuk bermain.</p></div><div class="bubble" id="speech" role="status">Psst, sini duduk sama Mimi ♡</div></section><div class="panel"><div class="bar"><p id="hint"></p><button id="action"></button></div><div id="choices"></div><div class="gestures" role="group" aria-label="Sentuhan dan candaan"><button id="pet">Elus Mimi</button><button id="peek">Cilukba</button><button id="five">Tos Mimi</button></div><nav aria-label="Kegiatan Mimi"><button data-mode="feed"><span>🐟</span>Makan</button><button data-mode="wash"><span>🫧</span>Mandi</button><button data-mode="chat"><span>💌</span>Ngobrol</button><button data-mode="play"><span>🧶</span>Main</button></nav></div></main><script type="module" src="kamar-mimi.js"></script></html>
