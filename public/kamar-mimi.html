<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kamar Mimi · Ruang Iqlima</title>
  <link rel="stylesheet" href="/mimi-palette.css">
  <link rel="stylesheet" href="/kamar-mimi.css">
  <script src="/mimi-theme.js"></script>
</head>
<body>
<main>
<header>
<a href="./">‹ Hari Ini</a>
<h1>Kamar Mimi</h1>
<span class="hearts" aria-label="Hati terkumpul">♡ <b id="score">0</b>
</span>
</header>
<section class="room" aria-label="Teras mawar">
<div class="place">✧ Teras mawar</div>
<div aria-hidden="true" class="petals">
<i style="--n:0">
</i>
<i style="--n:1">
</i>
<i style="--n:2">
</i>
<i style="--n:3">
</i>
<i style="--n:4">
</i>
<i style="--n:5">
</i>
<i style="--n:6">
</i>
</div>
<canvas tabindex="0" aria-label="Kamar tiga dimensi Mimi. Gunakan panah kiri atau kanan untuk mengibaskan benang.">
</canvas>
<div id="fallback" hidden>
<img src="mimi.webp" alt="Mimi memeluk buku pink">
<p>Mode ilustrasi · Gunakan tombol di bawah untuk bermain.</p>
</div>
<div class="bubble" id="speech" role="status">Psst, sini duduk sama Mimi ♡</div>
</section>
<div class="panel">
<nav aria-label="Kegiatan Mimi">
<button data-mode="feed">
<span aria-hidden="true">🐟</span>Makan</button>
<button data-mode="wash">
<span aria-hidden="true">🫧</span>Mandi</button>
<button data-mode="chat">
<span aria-hidden="true">💌</span>Ngobrol</button>
<button data-mode="play">
<span aria-hidden="true">🧶</span>Main</button>
</nav>
<div class="bar">
<p id="hint">
</p>
<button id="action">
</button>
</div>
<div id="choices">
</div>
<div class="gestures" role="group" aria-label="Sentuhan dan candaan">
<button id="pet">Elus Mimi</button>
<button id="peek">Cilukba</button>
<button id="five">Tos Mimi</button>
</div>
</div>
</main>
<script type="module" src="kamar-mimi.js">
</script>
</body>
</html>
