# Uji otomatis di GitHub: web + server (Node) dan aplikasi Flutter.
# Flutter tidak bisa dipasang di lingkungan pengembangan Claude, jadi di sinilah kode Dart
# pertama kali dikompilasi dan dites. Hasilnya ada di tab Actions repo.
name: CI
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Web
        run: |
          npm ci
          npm run build
          TZ=Asia/Jakarta node --test tests/*.test.mjs
      - name: Server
        working-directory: server
        run: |
          npm ci
          npm test

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Analisis (error dan warning menggagalkan, info hanya dilaporkan)
        run: flutter analyze --no-fatal-infos
      - name: Tes
        run: flutter test
      - name: Build Android (debug)
        run: flutter build apk --debug
