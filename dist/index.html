  (() => {
    const key = 'titip-mimi-theme';
    const root = document.documentElement;
    const media = window.matchMedia('(prefers-color-scheme: dark)');
    let mode = 'system';
    function apply(value) {
      mode = ['light', 'dark'].includes(value) ? value : 'system';
      root.dataset.preference = mode;
      root.dataset.theme = mode === 'system' ? (media.matches ? 'dark' : 'light') : mode;
      document.querySelectorAll('[data-theme-choice]').forEach(field => field.value = mode);
    }
    try { apply(localStorage.getItem(key)); } catch { apply('system'); }
    media.addEventListener('change', () => apply(mode));
    window.addEventListener('storage', event => { if (event.key === key || event.key === null) apply(event.newValue); });
    document.addEventListener('change', event => {
      if (!event.target.matches('[data-theme-choice]')) return;
      apply(event.target.value);
      try { localStorage.setItem(key, mode); } catch {}
    });
    document.addEventListener('DOMContentLoaded', () => apply(mode));
  })();
