<!doctype html>
<html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kamar Mimi · Titip Mimi</title>
<style>
*{box-sizing:border-box}body{--paper:#fffbf5;--ink:#422738;--rose:#a03862;--line:#dfbbc6;margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 system-ui,sans-serif}body.dark{--paper:#2e222c;--ink:#ffe8ed;--line:#815b70;--rose:#f7a7c3}main{width:min(100%,720px);margin:auto;padding:16px}a{color:var(--rose)}h1{font: bold clamp(24px,5vw,36px) Georgia;margin:.7rem 0}canvas{display:block;width:100%;height:auto;background:#f5dedd;border-radius:24px;border:1px solid var(--line);touch-action:manipulation}button{font:inherit;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:16px;min-height:46px;padding:8px 14px;cursor:pointer}button:hover,button[aria-pressed=true]{border-color:var(--rose);box-shadow:inset 0 0 0 1px var(--rose)}button:focus-visible,a:focus-visible{outline:3px solid var(--rose);outline-offset:2px}nav{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}#options{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}#message{margin:12px 0;color:var(--ink)}@media(max-width:480px){nav{grid-template-columns:1fr 1fr}}
</style>
<main><a href="/">‹ Hari Ini</a><h1>Kamar Mimi</h1><canvas width="680" height="410" aria-label="Kamar tiga dimensi dengan Mimi si kucing krem berpita merah muda"></canvas>
<p id="message" role="status">Mimi sudah duduk manis. Mau ngapain bareng?</p>
<nav aria-label="Kegiatan Mimi"><button data-action="makan">Beri makan</button><button data-action="mandi">Mandiin</button><button data-action="ngobrol">Ngobrol</button><button data-action="main">Main bola</button></nav><div id="options"></div></main>
<script>
try { document.body.classList.toggle('dark',localStorage.getItem('titip-mimi-theme')==='dark'); } catch {}
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),msg=document.querySelector('#message'),options=document.querySelector('#options');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let action='',start=0,target=1.6,frame=0,faces=[];
function project([x,y,z]) {
  const depth=8-z, scale=530/depth;
  return [340+x*scale,204+(.9-y+.24*z)*scale];
}
function polygon(vertices,color,light=1){
  const rgb=[1,3,5].map(i=>Math.round(parseInt(color.slice(i,i+2),16)*light));
  faces.push({z:vertices.reduce((s,v)=>s+v[2],0)/vertices.length,points:vertices.map(project),color:'rgb('+rgb.join(',')+')'});
}
function oval(x,y,z,w,h,d,color){
  const lat=8,lon=16;
  const point=(a,b)=>[x+w*Math.cos(a)*Math.cos(b),y+h*Math.sin(a),z+d*Math.cos(a)*Math.sin(b)];
  for(let i=0;i<lat;i++)for(let j=0;j<lon;j++){
    const a=-Math.PI/2+i*Math.PI/lat,b=j*2*Math.PI/lon,A=a+Math.PI/lat,B=b+2*Math.PI/lon;
    const m=(a+A)/2,n=(b+B)/2;
    polygon([point(a,b),point(A,b),point(A,B),point(a,B)],color,.88+.12*(Math.sin(m)*.55+Math.cos(m)*Math.sin(n)*.45));
  }
}
function ear(x,y,z,side){
  const a=[x-.26,y,z],b=[x+.26,y,z],tip=[x+.18*side,y+.65,z-.02],back=[x,y,z-.35];
  polygon([a,b,tip],'#ffe6c4');polygon([b,back,tip],'#e5be9c');polygon([back,a,tip],'#f8d8b2');
  polygon([[x-.14,y+.04,z+.02],[x+.14,y+.04,z+.02],[x+.14*side,y+.47,z+.02]],'#efa7a9');
}
function draw(now){
  const t=Math.max(0,(now-start)/1000),p=Math.min(1,t/2.7),arc=Math.sin(p*Math.PI);
  const x=action==='main'?target*arc:0, bob=action==='main'?.1*Math.abs(Math.sin(p*6*Math.PI)):0;
  const nod=action==='makan'?-.18*Math.abs(Math.sin(p*4*Math.PI)):0;
  faces=[];ctx.clearRect(0,0,680,410);
  ctx.fillStyle='#ead6cb';ctx.fillRect(0,262,680,148);
  ctx.fillStyle='#fff2d6';ctx.fillRect(56,34,124,114);
  ctx.fillStyle='#efc5bd';ctx.fillRect(115,34,7,114);ctx.fillRect(56,87,124,7);
  oval(0,-.4,0,2.8,.08,1.4,'#de9bab');
  oval(x+.66,.45+bob,-.22,.28,.66,.22,'#edc8a6');
  oval(x,.42+bob,0,.62,.75,.51,'#ffe6c5');
  for(const s of [-1,1])oval(x+s*.37,-.06+bob,.31,.24,.19,.21,'#ffead0');
  const y=1.34+bob+nod;
  oval(x,y,.18,.8,.7,.6,'#ffe9c9');
  for(const s of [-1,1]){
    ear(x+s*.48,y+.43,.23,s);
    oval(x+s*.31,y+.04,.735,.067,.095,.043,'#513642');
    oval(x+s*.44,y-.11,.67,.10,.047,.023,'#f1a5af');
  }
  oval(x,y-.095,.795,.067,.047,.035,'#c57981');
  for(const s of [-1,1])oval(x+.50+s*.12,y+.49,.53,.15,.105,.055,'#d65d82');
  oval(x+.5,y+.49,.58,.067,.065,.05,'#f49db1');
  if(action==='makan'){oval(.05,-.14,1.12,.46,.17,.27,'#c3758c');for(let i=0;i<5;i++)oval(-.2+i*.105,-.035,1.14,.07,.055,.07,'#98704d')}
  if(action==='mandi')for(let i=0;i<9;i++)oval(Math.sin(i*4)*.85,.1+(i*.25+p*.8)%2.4,.85,.09,.09,.09,'#c5ebf0');
  if(action==='main')oval(target*(p<.48?Math.min(1,p/.25):arc)+.25,-.1+.18*Math.abs(Math.sin(p*4*Math.PI)),.86,.23,.23,.23,'#b590cf');
  faces.sort((a,b)=>a.z-b.z);
  for(const face of faces){ctx.beginPath();face.points.forEach(([a,b],i)=>i?ctx.lineTo(a,b):ctx.moveTo(a,b));ctx.closePath();ctx.fillStyle=ctx.strokeStyle=face.color;ctx.lineWidth=.5;ctx.fill();ctx.stroke()}
  if(action && t<2.7 && !reduced && !document.hidden)frame=requestAnimationFrame(draw);
  else frame=0;
}
function animate(){cancelAnimationFrame(frame);start=performance.now();draw(start+(reduced?1100:0))}
function choice(label,callback){const b=document.createElement('button');b.textContent=label;b.onclick=callback;options.append(b)}
function throwBall(direction){target=direction;action='main';msg.textContent='Hop! Mimi mengejar bola dan membawanya balik.';animate()}
function choose(kind){
  action=kind;options.replaceChildren();
  document.querySelectorAll('[data-action]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.action===kind)));
  if(kind==='makan')msg.textContent='Kriuk, kriuk… Mimi lahap makan dari mangkuknya ♡';
  if(kind==='mandi')msg.textContent='Busa lembut buat Mimi. Sekarang bulunya wangi lagi!';
  if(kind==='ngobrol'){
    msg.textContent='Mimi pasang telinga. Kamu mau bilang apa?';
    for(const [say,reply] of [['Hari ini capek','Sini, duduk sebentar sama Mimi. Mrrr…'],['Aku lagi senang','Meong! Mimi ikut senang dengarnya ♡'],['Hai, Mimi','Hai juga! Mimi geser sedikit, sini duduk dekat Mimi.']])choice(say,()=>{msg.textContent=reply});
  }
  if(kind==='main'){msg.textContent='Lempar bolanya ke mana? Ketuk kamar atau pilih arah.';choice('Lempar kiri',()=>throwBall(-1.7));choice('Lempar kanan',()=>throwBall(1.7));action='siap'}
  animate();
}
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>choose(b.dataset.action));
canvas.onclick=e=>{if(action==='main'||action==='siap'){const rect=canvas.getBoundingClientRect();throwBall(Math.max(-2.5,Math.min(2.5,(e.clientX-rect.left-rect.width/2)*5/rect.width)))}};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)draw(performance.now())});
draw(0);
</script></html>
